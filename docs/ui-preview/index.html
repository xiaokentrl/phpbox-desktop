<!DOCTYPE html>
<html lang="zh-CN" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phpbox Desktop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b9cff'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='monospace'>π</text></svg>">
<style>
:root{
  --r:12px; --r-sm:8px; --r-xs:6px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sidebar-width:200px; --drawer-height:160px;
  --content-max:1200px; --content-pad-x:40px;
  --motion-fast:.13s; --motion-base:.2s; --motion-slow:.25s;
}
:root,[data-theme="midnight"]{
  --bg:#0a0c10; --surface:#11141b; --surface-2:#171b24; --surface-3:#1c2130;
  --border:#222835; --border-2:#1a1f2a;
  --text:#e7ecf5; --text-dim:#8b95ab; --text-mute:#5b6578;
  --accent:#5b9cff; --accent-2:#74acff; --accent-bg:rgba(91,156,255,.13);
  --ok:#3dd68c; --ok-bg:rgba(61,214,140,.13);
  --warn:#f5a623; --warn-bg:rgba(245,166,35,.13);
  --danger:#ff5c5c; --danger-bg:rgba(255,92,92,.13);
  --purple:#8b5cf6;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#f1f3f7; --surface-3:#eef1f6;
  --border:#e2e6ee; --border-2:#eceff4;
  --text:#1a2030; --text-dim:#5d677a; --text-mute:#8f98a8;
  --accent:#3b82f6; --accent-2:#2563eb; --accent-bg:rgba(59,130,246,.10);
  --ok:#16a34a; --ok-bg:rgba(22,163,74,.12);
  --warn:#d97706; --warn-bg:rgba(217,119,6,.12);
  --danger:#dc2626; --danger-bg:rgba(220,38,38,.10);
  --purple:#8b5cf6;
  --shadow:0 8px 32px rgba(20,30,60,.10);
  color-scheme:light;
}
[data-theme="oled"]{
  --bg:#000; --surface:#08090b; --surface-2:#0f1115; --surface-3:#15181f;
  --border:#1a1e26; --border-2:#14171d;
  --text:#f5f7fa; --text-dim:#98a1b3; --text-mute:#5e6776;
  --accent:#60a5fa; --accent-2:#7db4fb; --accent-bg:rgba(96,165,250,.14);
  --ok:#34d399; --ok-bg:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
  --danger:#f87171; --danger-bg:rgba(248,113,113,.14);
  --purple:#a78bfa;
  --shadow:0 8px 32px rgba(0,0,0,.8);
  color-scheme:dark;
}
[data-theme="forest"]{
  --bg:#0b1512; --surface:#101d18; --surface-2:#15241e; --surface-3:#1a2c25;
  --border:#22392f; --border-2:#1a2c24;
  --text:#e3efe9; --text-dim:#8aa89a; --text-mute:#5a7267;
  --accent:#4ade80; --accent-2:#6ee7a0; --accent-bg:rgba(74,222,128,.14);
  --ok:#22c55e; --ok-bg:rgba(34,197,94,.14);
  --warn:#facc15; --warn-bg:rgba(250,204,21,.14);
  --danger:#f87171; --danger-bg:rgba(248,113,113,.14);
  --purple:#a78bfa;
  --shadow:0 8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
[data-theme="ocean"]{
  --bg:#080e1a; --surface:#0d1625; --surface-2:#122035; --surface-3:#182a44;
  --border:#1e3252; --border-2:#16273f;
  --text:#e0e8f5; --text-dim:#8ba3c7; --text-mute:#5a7194;
  --accent:#38bdf8; --accent-2:#5ecffa; --accent-bg:rgba(56,189,248,.14);
  --ok:#2dd4bf; --ok-bg:rgba(45,212,191,.14);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.14);
  --danger:#fb7185; --danger-bg:rgba(251,113,133,.14);
  --purple:#a78bfa;
  --shadow:0 8px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
[data-theme="sakura"]{
  --bg:#fdf7f8; --surface:#fff; --surface-2:#fbeef2; --surface-3:#f7e4eb;
  --border:#f0d8e0; --border-2:#f7e8ee;
  --text:#3a2530; --text-dim:#7a5563; --text-mute:#a88793;
  --accent:#ec4899; --accent-2:#db2777; --accent-bg:rgba(236,72,153,.10);
  --ok:#059669; --ok-bg:rgba(5,150,105,.12);
  --warn:#d97706; --warn-bg:rgba(217,119,6,.12);
  --danger:#e11d48; --danger-bg:rgba(225,29,72,.10);
  --purple:#a855f7;
  --shadow:0 8px 32px rgba(190,120,150,.15);
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);font-size:14px;line-height:1.55;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background var(--motion-slow),color var(--motion-slow);
}
.mono{font-family:var(--mono)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute)}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:var(--sidebar-width) 1fr;height:100vh;transition:grid-template-columns var(--motion-base)}
.app.resizing{transition:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.view{flex:1;overflow-y:auto;min-height:0}
.view-inner{max-width:var(--content-max);margin:0 auto;padding:32px var(--content-pad-x) 60px}

.sidebar{position:relative;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px 10px;gap:2px;overflow:hidden;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:8px 8px 18px;flex-shrink:0}
.brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:19px;font-weight:600;flex-shrink:0;box-shadow:0 4px 14px var(--accent-bg)}
.brand-meta{min-width:0;overflow:hidden}
.brand-name{font-weight:650;letter-spacing:-.3px;font-size:15px;white-space:nowrap}
.brand-status{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-mute);margin-top:1px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-section{font-size:10.5px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.8px;padding:14px 10px 4px;white-space:nowrap}
.nav-section:first-child{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:13.5px;text-align:left;width:100%;transition:background var(--motion-fast),color var(--motion-fast);position:relative;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:550}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0;line-height:1}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-badge{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--text-mute);background:var(--surface-2);padding:1px 6px;border-radius:20px;min-width:20px;text-align:center;flex-shrink:0}
.nav-item.active .nav-badge{background:var(--accent-bg);color:var(--accent)}
.sidebar-foot{display:flex;flex-direction:column;gap:2px;padding-top:10px;margin-top:4px;border-top:1px solid var(--border-2);flex-shrink:0}
.btn-ghost{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-dim);font-size:12.5px;transition:background var(--motion-fast),color var(--motion-fast);white-space:nowrap;overflow:hidden}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-ghost svg{flex-shrink:0}
.sidebar-resizer{position:absolute;top:0;right:-3px;bottom:0;width:6px;cursor:col-resize;z-index:20;background:transparent;transition:background var(--motion-fast)}
.sidebar-resizer:hover,.sidebar-resizer.dragging{background:var(--accent);opacity:.45}

.view-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.view-header h1{font-size:24px;font-weight:640;letter-spacing:-.4px;line-height:1.25}
.view-sub{color:var(--text-dim);font-size:13px;margin-top:4px}
.header-actions{display:flex;gap:8px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:500;transition:all var(--motion-fast);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px var(--accent-bg)}
.btn-primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover:not(:disabled){background:var(--danger-bg)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-xs);color:var(--text-dim);transition:background var(--motion-fast),color var(--motion-fast);flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.rw-active{color:var(--accent)}
.icon-btn.rw-active:hover{background:var(--accent-bg)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.summary-item{background:var(--surface);padding:16px 18px}
.summary-num{font-size:22px;font-weight:620;font-family:var(--mono);letter-spacing:-.5px;line-height:1.1}
.summary-label{font-size:11.5px;color:var(--text-mute);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}

.table-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
thead th{text-align:left;padding:10px 16px;font-size:11px;font-weight:600;color:var(--text-mute);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
tbody td{padding:12px 16px;border-bottom:1px solid var(--border-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
/* ★ 端口列居中 */
th.col-port,td.col-port{text-align:center}

/* ★ 站点表格操作列：sticky 固定在右侧，永不被遮挡 */
th.col-actions,td.col-actions{
  position:sticky;right:0;
  background:var(--surface);
  z-index:2;
}
thead th.col-actions{background:var(--surface-2);z-index:3}
tbody tr:hover td.col-actions{background:var(--surface-2)}
td.col-actions::before,th.col-actions::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:1px;
  background:var(--border-2);pointer-events:none;
}

.site-domain{display:inline-flex;align-items:center;gap:9px;font-weight:550;padding:3px 8px 3px 3px;margin-left:-3px;border-radius:7px;transition:background var(--motion-fast),color var(--motion-fast);max-width:100%}
.site-domain:hover{background:var(--accent-bg);color:var(--accent)}
.site-domain .favicon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);transition:transform var(--motion-fast)}
.site-domain:hover .favicon{transform:scale(1.06)}
.site-domain .domain-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-domain .external-icon{opacity:0;transform:translate(-3px,3px);transition:opacity var(--motion-fast),transform var(--motion-fast)}
.site-domain:hover .external-icon{opacity:.8;transform:translate(0,0)}
.svc-cell{display:flex;align-items:center;gap:9px;font-weight:550;white-space:nowrap}
.svc-icon{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.php-select{appearance:none;padding:5px 26px 5px 10px;font-family:var(--mono);font-size:12.5px;border-radius:6px;border:1px solid var(--border);background-color:var(--bg);color:var(--accent);cursor:pointer;outline:none;min-width:84px;font-weight:550;transition:border-color var(--motion-fast),box-shadow var(--motion-fast);background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%238b95ab' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
.php-select:hover:not(:disabled){border-color:var(--accent)}
.php-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.path-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;border:1px dashed transparent;color:var(--text-dim);font-family:var(--mono);font-size:12px;transition:all var(--motion-fast);max-width:260px}
.path-btn:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.path-btn .path-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.port-cell{display:inline-flex;align-items:center;justify-content:center}
.port-edit{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--mono);font-size:12.5px;color:var(--text-dim);
  padding:3px 9px;border-radius:6px;
  border:1px dashed transparent;
  cursor:pointer;
  transition:all var(--motion-fast);
  min-width:52px;
}
.port-edit:hover{
  border-color:var(--accent);
  background:var(--accent-bg);
  color:var(--accent);
}
.port-edit.editing{padding:0;border:none;background:transparent;cursor:default}
.port-edit.editing:hover{background:transparent}
.port-edit input{
  font-family:var(--mono);font-size:12.5px;
  padding:3px 8px;border-radius:5px;
  border:1px solid var(--accent);
  background:var(--bg);color:var(--text);
  outline:none;width:64px;text-align:center;
  box-shadow:0 0 0 3px var(--accent-bg);
}
.port-edit.saving{color:var(--text-mute);pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border-2);white-space:nowrap}
.chip-accent{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bg)}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-off{background:var(--surface-2);color:var(--text-mute)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-err{background:var(--danger-bg);color:var(--danger)}
.pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.row-actions{display:flex;gap:4px;justify-content:flex-end;position:relative}

.row-menu{
  position:fixed;z-index:140;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);box-shadow:var(--shadow);
  padding:5px;min-width:180px;
  display:flex;flex-direction:column;gap:1px;
  animation:popIn .14s cubic-bezier(.2,.9,.3,1.15);
}
.row-menu-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 11px;border-radius:var(--r-xs);
  font-size:13px;color:var(--text-dim);cursor:pointer;
  transition:background var(--motion-fast),color var(--motion-fast);
  white-space:nowrap;text-align:left;width:100%;
}
.row-menu-item:hover{background:var(--surface-3);color:var(--text)}
.row-menu-item svg{flex-shrink:0;opacity:.85}
.row-menu-sep{height:1px;background:var(--border-2);margin:4px 2px}

.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;min-width:0}
.version-card{display:flex;flex-direction:column;gap:14px}
.version-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.version-tag{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.5px}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;gap:12px;min-height:28px}
.kv .k{color:var(--text-mute);flex-shrink:0}
.kv .v{color:var(--text-dim);font-family:var(--mono);font-size:12px;word-break:break-all;text-align:right;max-width:60%}
.version-card-foot{display:flex;gap:6px;margin-top:4px;padding-top:12px;border-top:1px solid var(--border-2);flex-wrap:wrap}
.version-card-foot .btn{flex:1 1 auto;min-width:0;padding-left:8px;padding-right:8px;font-size:12px}

.inline-edit{
  position:relative;
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:12px;color:var(--text-dim);
  padding:2px 8px;border-radius:5px;
  border:1px dashed transparent;
  cursor:pointer;
  transition:all var(--motion-fast);
  max-width:100%;
}
.inline-edit:hover{
  border-color:var(--accent);
  background:var(--accent-bg);
  color:var(--accent);
}
.inline-edit .edit-icon{opacity:0;flex-shrink:0;transition:opacity var(--motion-fast)}
.inline-edit:hover .edit-icon{opacity:.7}
.inline-edit.editing{padding:0;border:none;background:transparent;cursor:default}
.inline-edit.editing:hover{background:transparent}
.inline-edit input{
  font-family:var(--mono);font-size:12px;
  padding:3px 7px;border-radius:5px;
  border:1px solid var(--accent);
  background:var(--bg);color:var(--text);
  outline:none;width:auto;min-width:80px;
  box-shadow:0 0 0 3px var(--accent-bg);
}
.inline-edit input.port-input{width:80px;min-width:80px;text-align:right}
.inline-edit input.password-input{width:170px;min-width:170px}
.inline-edit input.text-input{width:200px;min-width:200px}
.inline-edit.saving{color:var(--text-mute);pointer-events:none}
.inline-edit.error{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
.inline-edit .pw{letter-spacing:2px;user-select:none}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;border:1px dashed var(--border);border-radius:var(--r);background:var(--surface)}
.empty-icon{font-size:42px;opacity:.55;margin-bottom:16px;line-height:1}
.empty h2{font-size:17px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--text-dim);font-size:13.5px;max-width:460px;margin-bottom:22px;line-height:1.65}

.drawer{position:relative;border-top:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;height:42px;flex-shrink:0;transition:height var(--motion-base)}
.drawer.expanded{height:var(--drawer-height)}
.drawer-log{flex:1;overflow-y:auto;padding:12px 16px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--text-dim);white-space:pre-wrap;word-break:break-word;margin:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity var(--motion-fast)}
.drawer.expanded .drawer-log{opacity:1;pointer-events:auto}
.drawer-resizer{position:absolute;top:-3px;left:0;right:0;height:6px;cursor:row-resize;z-index:20;background:transparent;transition:background var(--motion-fast)}
.drawer.expanded .drawer-resizer:hover,.drawer.expanded .drawer-resizer.dragging{background:var(--accent);opacity:.5}

.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}

.toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 40px)}

function defaultVhost(domain, port, php, root, rewriteKey){
  const rw = REWRITE_PRESETS[rewriteKey] || REWRITE_PRESETS.none;
  const phpTag = String(php).replace(/\./g, '');
  const ruleLines = rw.rule.split('\n').map(l => '    ' + l).join('\n');
  return `server {
    listen ${port};
    server_name ${domain};
    root ${root};
    index index.php index.html;
${ruleLines}
    location ~ \\.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php${phpTag}:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}`;
}

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp(v,min,max){ if(isNaN(v))return min; return Math.min(Math.max(v,min),max); }
function cmpVer(a,b){
  const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i]||0, y=pb[i]||0;
    if(x!==y) return y-x;
  }
  return 0;
}

const i18n = {
  locale: (()=>{ try{ return localStorage.getItem('phpbox-locale') || 'zh-CN'; }catch{ return 'zh-CN'; } })(),
  t(key, params){
    const msg = (MESSAGES[this.locale] && MESSAGES[this.locale][key])
             || MESSAGES['zh-CN'][key]
             || key;
    if (!params) return msg;
    return msg.replace(/\{(\w+)\}/g, (_,k) => params[k] != null ? params[k] : `{${k}}`);
  },
  setLocale(loc){
    this.locale = loc;
    try{ localStorage.setItem('phpbox-locale', loc); }catch{}
    document.documentElement.setAttribute('lang', loc);
  }
};
const t = (k,p) => i18n.t(k,p);

function toast(msg,kind='info',ttl=3200){
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .2s,transform .2s';
    el.style.opacity='0'; el.style.transform='translateX(12px)';
    setTimeout(()=>el.remove(),220);
  }, ttl);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    const ta = document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch{}
    ta.remove(); return ok;
  }
}

function siteUrl(site){
  if(!site || !site.domain) return '';
  const port = site.port;
  if(port && port !== 80 && port !== 443) return `http://${site.domain}:${port}`;
  return `http://${site.domain}`;
}

function suggestPortFor(kind, version){
  if(kind === 'mysql'){
    const digits = String(version).replace(/\./g, '').slice(0, 2);
    const n = parseInt(digits, 10);
    return isNaN(n) ? 3380 : 3300 + n;
  }
  if(kind === 'pgsql'){
    const major = parseInt(String(version).split('.')[0], 10);
    return isNaN(major) ? 5432 : 5400 + major;
  }
  if(kind === 'redis') return 6379;
  if(kind === 'nginx') return 80;
  return 0;
}

function genPassword(){
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  return [...arr].map(b => b.toString(16).padStart(2, '0')).join('');
}

function needsPort(kind){ return ['mysql','pgsql','redis','nginx'].includes(kind); }
function needsPassword(kind){ return ['mysql','pgsql','redis'].includes(kind); }

function getDefaultFiles(kind, version){
  const fn = DEFAULT_CONFIGS[kind];
  return fn ? fn(version) : [];
}
function getFileContent(kind, version, fileName){
  const key = `${kind}:${version}:${fileName}`;
  if(state.configs[key] != null) return state.configs[key];
  const def = getDefaultFiles(kind, version).find(f => f.name === fileName);
  return def ? def.content : '';
}
function setFileContent(kind, version, fileName, content){
  state.configs[`${kind}:${version}:${fileName}`] = content;
}

function getVhost(domain){
  if(!state.vhosts[domain]){
    const site = state.sites.find(s => s.domain === domain);
    state.vhosts[domain] = site
      ? defaultVhost(site.domain, site.port, site.php, site.root, site.rewrite)
      : '';
  }
  return state.vhosts[domain];
}

function isServiceRunning(kind, version){
  return !state.stopped[kind].includes(version);
}

const layout = {
  sidebarWidth: LAYOUT_PRESETS.compact.sidebar,
  drawerHeight: LAYOUT_PRESETS.compact.drawer,
  load(){
    let s=null,d=null;
    try{ s=localStorage.getItem('phpbox-sidebar-width'); d=localStorage.getItem('phpbox-drawer-height'); }catch{}
    this.sidebarWidth = s==null ? LAYOUT_PRESETS.compact.sidebar : clamp(parseInt(s,10),LAYOUT_LIMITS.sidebar.min,LAYOUT_LIMITS.sidebar.max);
    this.drawerHeight = d==null ? LAYOUT_PRESETS.compact.drawer : clamp(parseInt(d,10),LAYOUT_LIMITS.drawer.min,LAYOUT_LIMITS.drawer.max);
    this.apply();
  },
  save(){ try{ localStorage.setItem('phpbox-sidebar-width',this.sidebarWidth); localStorage.setItem('phpbox-drawer-height',this.drawerHeight); }catch{} },
  apply(){
    document.documentElement.style.setProperty('--sidebar-width', this.sidebarWidth+'px');
    document.documentElement.style.setProperty('--drawer-height', this.drawerHeight+'px');
  },
  setSidebar(w){ this.sidebarWidth=clamp(w,LAYOUT_LIMITS.sidebar.min,LAYOUT_LIMITS.sidebar.max); this.apply(); this.save(); markActivePreset(); },
  setDrawer(h){ this.drawerHeight=clamp(h,LAYOUT_LIMITS.drawer.min,LAYOUT_LIMITS.drawer.max); this.apply(); this.save(); markActivePreset(); },
  reset(){ this.sidebarWidth=LAYOUT_PRESETS.compact.sidebar; this.drawerHeight=LAYOUT_PRESETS.compact.drawer; this.apply(); this.save(); markActivePreset(); },
  applyPreset(name){ const p=LAYOUT_PRESETS[name]; if(!p) return; this.sidebarWidth=p.sidebar; this.drawerHeight=p.drawer; this.apply(); this.save(); markActivePreset(); },
};
function markActivePreset(){
  $$('.layout-preset-btn').forEach(b=>b.classList.remove('selected'));
  for(const [name,p] of Object.entries(LAYOUT_PRESETS)){
    if(p.sidebar===layout.sidebarWidth && p.drawer===layout.drawerHeight){
      const b=document.querySelector(`.layout-preset-btn[data-preset="${name}"]`);
      if(b) b.classList.add('selected');
      break;
    }
  }
}

function setupSidebarResize(){
  const app = $('#app'), resizer = $('#sidebar-resizer');
  if(!resizer) return;
  let startX=0, startW=0, dragging=false;
  const onDown = e=>{ if(window.innerWidth<=960) return; dragging=true; startX = e.clientX!=null?e.clientX:e.touches[0].clientX; startW=layout.sidebarWidth; app.classList.add('resizing'); resizer.classList.add('dragging'); document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; e.preventDefault(); };
  const onMove = e=>{ if(!dragging) return; const x=e.clientX!=null?e.clientX:e.touches[0].clientX; layout.setSidebar(startW+(x-startX)); };
  const onUp = ()=>{ if(!dragging) return; dragging=false; app.classList.remove('resizing'); resizer.classList.remove('dragging'); document.body.style.cursor=''; document.body.style.userSelect=''; };
  resizer.addEventListener('mousedown',onDown); resizer.addEventListener('touchstart',onDown,{passive:false});
  document.addEventListener('mousemove',onMove); document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onUp); document.addEventListener('touchend',onUp);
  resizer.addEventListener('dblclick', ()=>layout.setSidebar(LAYOUT_LIMITS.sidebar.default));
}
function setupDrawerResize(){
  const drawer = $('#drawer'), resizer = $('#drawer-resizer');
  if(!resizer) return;
  let startY=0, startH=0, dragging=false;
  const onDown = e=>{ if(!drawer.classList.contains('expanded')) return; dragging=true; startY=e.clientY!=null?e.clientY:e.touches[0].clientY; startH=drawer.offsetHeight; drawer.style.transition='none'; resizer.classList.add('dragging'); document.body.style.cursor='row-resize'; document.body.style.userSelect='none'; e.preventDefault(); };
  const onMove = e=>{ if(!dragging) return; const y=e.clientY!=null?e.clientY:e.touches[0].clientY; layout.setDrawer(startH+(startY-y)); };
  const onUp = ()=>{ if(!dragging) return; dragging=false; drawer.style.transition=''; resizer.classList.remove('dragging'); document.body.style.cursor=''; document.body.style.userSelect=''; };
  resizer.addEventListener('mousedown',onDown); resizer.addEventListener('touchstart',onDown,{passive:false});
  document.addEventListener('mousemove',onMove); document.addEventListener('touchmove',onMove,{passive:false});

}
function setupModalResize(modal){
  if(!modal) return;
  const resizer = modal.querySelector('.modal-resizer');
  if(!resizer) return;
  let sx=0,sy=0,sw=0,sh=0,dragging=false;
  const onDown = e=>{ dragging=true; sx=e.clientX!=null?e.clientX:e.touches[0].clientX; sy=e.clientY!=null?e.clientY:e.touches[0].clientY; sw=modal.offsetWidth; sh=modal.offsetHeight; modal.style.width=sw+'px'; modal.style.height=sh+'px'; modal.style.maxWidth='none'; modal.style.maxHeight='none'; document.body.style.cursor='nwse-resize'; document.body.style.userSelect='none'; e.preventDefault(); e.stopPropagation(); };
  const onMove = e=>{ if(!dragging) return; const x=e.clientX!=null?e.clientX:e.touches[0].clientX; const y=e.clientY!=null?e.clientY:e.touches[0].clientY; modal.style.width=clamp(sw+(x-sx),360,window.innerWidth-60)+'px'; modal.style.height=clamp(sh+(y-sy),240,window.innerHeight-60)+'px'; };
  const onUp = ()=>{ if(!dragging) return; dragging=false; document.body.style.cursor=''; document.body.style.userSelect=''; };
  resizer.addEventListener('mousedown',onDown); resizer.addEventListener('touchstart',onDown,{passive:false});
  document.addEventListener('mousemove',onMove); document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onUp); document.addEventListener('touchend',onUp);
}

function closeModal(){ const root=$('#modal-root'); root.classList.remove('open'); root.innerHTML=''; root.onkeydown=null; }
function openModalShell(html,{danger=false}={}){
  const root = $('#modal-root');
  root.innerHTML = html; root.classList.add('open');
  setupModalResize($('.modal', root));
  root.onkeydown = e=>{ if(e.key==='Escape' && !danger) closeModal(); };
  return root;
}

function openDangerConfirm(opts){
  const { title, description, warnings=[], cliPreview, confirmLabel, checkbox, onConfirm } = opts;
  let checked = !checkbox;
  const warningList = warnings.length ? `<ul class="danger-list">${warnings.map(w=>{const text=typeof w==='string'?w:w.text;const keep=typeof w==='object'&&w.keep;return `<li class="${keep?'keep':''}">${esc(text)}</li>`;}).join('')}</ul>` : '';
  const checkboxBlock = checkbox ? `<label class="danger-check" id="dc-check-wrap"><input type="checkbox" id="dc-check"><span class="check-label">${esc(checkbox.label)}</span></label>` : '';
  const cliBlock = cliPreview ? `<div class="field"><label>${esc(t('install.preview'))}</label><div class="cmd-preview"><span class="prompt">$ </span>${esc(cliPreview)}</div></div>` : '';
  openModalShell(`
    <div class="modal" role="dialog" aria-modal="true">
      <div class="danger-header"><div class="danger-icon">⚠</div><div style="flex:1"><h3>${esc(title)}</h3>${description?`<p>${esc(description)}</p>`:''}</div></div>
      <div class="modal-body">${warningList}${checkboxBlock}${cliBlock}</div>
      <div class="modal-foot"><button class="btn" data-modal-close>${esc(t('common.cancel'))}</button><button class="btn btn-danger" id="dc-ok" disabled style="background:var(--danger-bg);border-color:var(--danger-bg)">${esc(confirmLabel)}</button></div>
      <div class="modal-resizer"></div>
    </div>`,{danger:true});
  const root = $('#modal-root'), okBtn = $('#dc-ok');
  const checkEl = checkbox ? $('#dc-check') : null;
  const checkWrap = checkbox ? $('#dc-check-wrap') : null;
  okBtn.disabled = !checked;
  if(checkEl){
    checkEl.addEventListener('change', ()=>{ checked = checkEl.checked; checkWrap.classList.toggle('checked', checked); okBtn.disabled = !checked; });
  }
  $$('[data-modal-close]', root).forEach(b=>b.addEventListener('click', closeModal));
  okBtn.addEventListener('click', ()=>{ closeModal(); onConfirm && onConfirm(); });
}

    lines.push({t:'ok',   s:'  ✓ MySQL / PostgreSQL / Redis stopped'});
    lines.push({t:'meta', s:'[2/5] Pack volumes'});
    lines.push({t:'ok',   s:'  ✓ ownership preserved'});
    lines.push({t:'meta', s:'[3/5] Pack data dirs'});
    lines.push({t:'ok',   s:'  ✓ containerized pack'});
    lines.push({t:'meta', s:'[4/5] Archive'});
    lines.push({t:'ok',   s:'  ✓ backups/backup-20260913-093015.tar.gz (48.2 MB)'});
    lines.push({t:'meta', s:'[5/5] Restart'});
    lines.push({t:'ok',   s:'  ✓ all restarted'});
    lines.push({t:'ok',   s:'✓ Backup completed'});
  } else if(args[0]==='doctor'){
    lines.push({t:'meta', s:'Environment doctor'});
    lines.push({t:'ok',   s:'  ✓ Docker 28.0.1'});
    lines.push({t:'ok',   s:'  ✓ Compose v2.29.7'});
    lines.push({t:'ok',   s:'  ✓ Disk free 128 GB'});
    lines.push({t:'ok',   s:'  ✓ Offline cache 1.42 GB (under 2.0 GB)'});
    lines.push({t:'ok',   s:'✓ No issues'});
  } else if(args[0]==='go' && args[1]==='server'){
    lines.push({t:'meta', s:`Scan ${state.env.GO_PROJECTS_ROOT}`});
    lines.push({t:'ok',   s:'  ✓ found 2 projects'});
    lines.push({t:'ok',   s:'✓ Scan done'});
  } else if(args[0]==='offline' && args[1]==='verify'){
    lines.push({t:'meta', s:'Verify each tar'});
    lines.push({t:'ok',   s:'  ✓ all passed'});
  } else {
    lines.push({t:'dim',  s:'Running…'});
    lines.push({t:'ok',   s:'✓ Done'});
  }
  return lines;
}

function runTask(args, label, meta){
  if(state.taskTimer) clearTimeout(state.taskTimer);
  state.task = { args, label: label||args.join(' '), lines: buildScript(args, meta), status:'running', cursor:0, startedAt:Date.now() };
  const drawer = $('#drawer');
  $('#drawer-label').textContent = state.task.label;
  $('#drawer-cmd').textContent = 'phpbox ' + args.join(' ');
  $('#drawer-dot').className = 'drawer-dot running';
  $('#drawer-status').textContent = t('task.running');
  $('#drawer-log').innerHTML = '';
  drawer.classList.add('expanded');
  updateTray();
  playTask(meta);
}

function playTask(meta){
  const task = state.task, log = $('#drawer-log');
  function next(){
    if(!state.task || state.task !== task) return;
    if(task.cursor >= task.lines.length){
      task.status = 'success';
      $('#drawer-dot').className = 'drawer-dot success';
      const dur = ((Date.now()-task.startedAt)/1000).toFixed(1);
      $('#drawer-status').textContent = t('task.complete', {dur});
      applyStateChange(meta);
      updateTray();
      if(meta && meta.type === 'update-config' && meta.onSuccess) meta.onSuccess();
      if(meta && meta.type === 'update-global' && meta.onSuccess) meta.onSuccess();
      return;
    }
    const entry = task.lines[task.cursor++];
    const div = document.createElement('div');
    let cls = 'log-line';
    if(entry.t==='err') cls+=' err';
    if(entry.t==='ok') cls+=' ok';
    if(entry.t==='cmd') cls+=' cmd';
    if(entry.t==='meta') cls+=' meta';
    if(entry.t==='dim') cls+=' dim';
    div.className = cls;
    div.textContent = entry.s || ' ';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    state.taskTimer = setTimeout(next, entry.t==='cmd'?120:90+Math.random()*200);
  }
  next();
}

function applyStateChange(meta){
  if(!meta) return;
  if(meta.type==='install'){
    if(meta.kind==='nginx') state.installed.nginx=[meta.version];
    else if(!state.installed[meta.kind].includes(meta.version)){
      state.installed[meta.kind].push(meta.version);
      state.installed[meta.kind].sort(cmpVer);
      if(meta.kind==='php'){
        state.phpExtensions[meta.version]=['gd','redis','pdo_mysql','mysqli','pgsql','pdo_pgsql','zip','bcmath','intl','opcache','exif','soap','sockets','imagick','xdebug'];
      }
    }
    if(meta.port){
      if(meta.kind==='nginx') state.env.NGINX_PORT = String(meta.port);
      else if(meta.version){
        const key = `${meta.kind.toUpperCase()}_${meta.version.replace(/\./g,'')}_PORT`;
        state.env[key] = String(meta.port);
      }
    }
    if(meta.password && meta.version){
      const key = `${meta.kind.toUpperCase()}_${meta.version.replace(/\./g,'')}_ROOT_PASSWORD`;
      state.env[key] = String(meta.password);
    }
  } else if(meta.type==='uninstall'){
    state.installed[meta.kind] = state.installed[meta.kind].filter(v=>v!==meta.version);
    state.stopped[meta.kind] = state.stopped[meta.kind].filter(v => v !== meta.version);
  } else if(meta.type==='service-stop'){
    if(!state.stopped[meta.kind].includes(meta.version)){
      state.stopped[meta.kind].push(meta.version);
    }
  } else if(meta.type==='service-start'){
    state.stopped[meta.kind] = state.stopped[meta.kind].filter(v => v !== meta.version);
  } else if(meta.type==='update-config'){
    if(meta.field === 'port'){
      if(meta.kind === 'nginx') state.env.NGINX_PORT = String(meta.newValue);
      else {
        const key = `${meta.kind.toUpperCase()}_${meta.version.replace(/\./g,'')}_PORT`;
        state.env[key] = String(meta.newValue);
      }
    } else if(meta.field === 'password'){
      const key = `${meta.kind.toUpperCase()}_${meta.version.replace(/\./g,'')}_ROOT_PASSWORD`;
      state.env[key] = String(meta.newValue);
    }
  } else if(meta.type==='update-global'){
    state.env[meta.key] = String(meta.newValue);
  } else if(meta.type==='site-add'){
    if(!state.sites.find(s=>s.domain===meta.domain)){
      state.sites.push({
        domain:meta.domain, port:meta.port, php:meta.php,
        root: meta.root || `/var/www/${meta.domain}`,
        hosts:false, health:'warn', rewrite:meta.rewrite
      });
      state.vhosts[meta.domain] = defaultVhost(meta.domain, meta.port, meta.php, meta.root || `/var/www/${meta.domain}`, meta.rewrite);
    }
  } else if(meta.type==='site-vhost'){
    // vhost 已保存
  } else if(meta.type==='site-port'){
    const site = state.sites.find(s => s.domain === meta.domain);
    if(site){
      site.port = meta.newValue;
      const vh = getVhost(meta.domain);
      state.vhosts[meta.domain] = vh.replace(/listen\s+\d+\s*;/, `listen ${meta.newValue};`);
    }
  } else if(meta.type==='site-remove'){
    state.sites = state.sites.filter(s=>s.domain!==meta.domain);
    delete state.vhosts[meta.domain];
  } else if(meta.type==='offline-prune'){
    state.offline.trees = state.offline.trees.filter(x=>!(x.svc===meta.svc && x.ver===meta.ver));
  }
  setTimeout(()=>{ render(); toast(t('toast.uiUpdated'),'ok',1400); },320);
}

function setupInlineEdit(root){
  $$('.inline-edit', root).forEach(el=>{

      e.stopPropagation();
      startEdit(el);
    });
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && !el.classList.contains('editing')){
        e.preventDefault();
        startEdit(el);
      }
    });
  });

function startEdit(el){
  if(el.classList.contains('editing')) return;
  const kind = el.dataset.kind;
  const version = el.dataset.version || '';
  const field = el.dataset.field;
  const type = el.dataset.inline || 'text';
  const original = el.dataset.original || el.textContent.trim();

  let realValue = original;
  if(type === 'password'){
    const key = `${kind.toUpperCase()}_${version.replace(/\./g,'')}_ROOT_PASSWORD`;
    realValue = state.env[key] || '';
  }

  const inputCls = type === 'port' ? 'port-input' : (type === 'password' ? 'password-input' : 'text-input');
  const inputVal = type === 'password' ? realValue : (realValue === '—' ? '' : realValue);

  el.classList.add('editing');
  el.innerHTML = `<input type="text" class="${inputCls}" value="${esc(inputVal)}" spellcheck="false" autocomplete="off">`;
  const input = el.querySelector('input');
  input.focus();
  input.select();

  let committed = false;

  function cancel(){
    if(committed) return;
    committed = true;
    el.classList.remove('editing');
    el.innerHTML = originalHtml(el);
    setupInlineEdit(el.parentElement || document);
  }

  function commit(){
    if(committed) return;
    const newValue = input.value.trim();

    if(type === 'port'){
      if(!/^\d{1,5}$/.test(newValue)){
        toast(t('common.invalidPort'), 'err');
        input.focus();
        return;
      }
    }
    if(type === 'password'){
      if(newValue.length < 6){
        toast(t('common.shortPassword'), 'err');
        input.focus();
        return;
      }
    }

    if(newValue === realValue){
      cancel();
      return;
    }

    committed = true;
    el.classList.remove('editing');
    el.classList.add('saving');

    if(type === 'password'){
      el.innerHTML = `<span class="pw">••••••••</span>`;
      el.dataset.original = '••••••••';
    } else {
      el.innerHTML = `${esc(newValue)}`;
      el.dataset.original = newValue;
    }

    const meta = {
      type: (kind === 'go') ? 'update-global' : 'update-config',
      kind, version, field,
      oldValue: realValue,
      newValue: newValue,
      key: (kind === 'go') ? field : undefined,
    };
    runTask([kind, field, 'set', version, newValue].filter(Boolean),
            `${kind} ${version} · ${field} → ${newValue.length > 12 ? newValue.slice(0,8)+'…' : newValue}`,
            meta);

    setTimeout(()=>{
      el.classList.remove('saving');
    }, 4000);
  }

  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
    e.stopPropagation();
  });
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{ if(!committed) cancel(); }, 100);
  });
}

function originalHtml(el){
  const type = el.dataset.inline || 'text';
  if(type === 'password'){
    return `<span class="pw">••••••••</span>`;
  }
  return esc(el.dataset.original || '');
}

function startPortEdit(el){
  if(el.classList.contains('editing')) return;
  const domain = el.dataset.domain;
  const original = el.dataset.original || el.textContent.trim();

  el.classList.add('editing');
  el.innerHTML = `<input type="text" inputmode="numeric" value="${esc(original)}" spellcheck="false" autocomplete="off">`;
  const input = el.querySelector('input');
  input.focus();
  input.select();

  let committed = false;

  function cancel(){
    if(committed) return;
    committed = true;
    el.classList.remove('editing');
    el.innerHTML = esc(original);
  }

  function commit(){
    if(committed) return;
    const newValue = input.value.trim();
    if(!/^\d{1,5}$/.test(newValue)){
      toast(t('common.invalidPort'), 'err');
      input.focus();
      return;
    }
    const newPort = parseInt(newValue, 10);
    const oldPort = parseInt(original, 10);
    if(newPort === oldPort){
      cancel();
      return;
    }

    committed = true;
    el.classList.remove('editing');
    el.classList.add('saving');
    el.innerHTML = esc(newValue);
    el.dataset.original = newValue;

    const site = state.sites.find(s => s.domain === domain);
    if(site) site.port = newPort;

    runTask(
      ['site', 'port', 'set', domain, String(newPort)],
      `${domain} · 端口 ${oldPort} → ${newPort}`,
      { type: 'site-port', domain, oldValue: oldPort, newValue: newPort }
    );

    setTimeout(()=>{ el.classList.remove('saving'); }, 4000);
  }

  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
    e.stopPropagation();
  });
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{ if(!committed) cancel(); }, 100);
  });
}

function versionCard(kind, version){
  const rows = [];
  const running = isServiceRunning(kind, version);

  if(needsPort(kind)){
    let portValue;
    if(kind === 'nginx'){
      portValue = state.env.NGINX_PORT || '80';
    } else {
      const key = `${kind.toUpperCase()}_${version.replace(/\./g,'')}_PORT`;
      portValue = state.env[key] || suggestPortFor(kind, version) || '';
    }
    rows.push(`
      <div class="kv">
        <span class="k">${t('svc.port')}</span>
        <span class="inline-edit" 
              data-inline="port" 
              data-kind="${esc(kind)}" 
              data-version="${esc(version)}" 
              data-field="port"
              data-original="${esc(portValue)}"
              tabindex="0"
              title="${esc(t('common.edit'))}">
          ${esc(portValue)}
        </span>
      </div>`);
  }

  if(needsPassword(kind)){
    rows.push(`
      <div class="kv">
        <span class="k">${t('svc.password')}</span>
        <span class="inline-edit" 
              data-inline="password" 
              data-kind="${esc(kind)}" 
              data-version="${esc(version)}" 
              data-field="password"
              data-original="••••••••"
              tabindex="0"
              title="${esc(t('common.edit'))}">
          <span class="pw">••••••••</span>
        </span>
      </div>`);
  }

  // ★ PHP：扩展管理是一个明确的按钮，点击弹出扩展列表（可增可删）

  rows.push(`<div class="kv"><span class="k">${t('svc.config')}</span><span class="v">config/${kind}/${version}/</span></div>`);

  const filesCount = getDefaultFiles(kind, version).length;
  const configBtn = `<button class="btn btn-sm" data-action="service-config" data-kind="${esc(kind)}" data-version="${esc(version)}">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M8 13h8M8 17h5"/></svg>
    ${t('svc.manageConfig')}<span style="opacity:.55;font-family:var(--mono);font-size:11px;margin-left:2px">${filesCount}</span>
  </button>`;

  // ★ 单版本启停按钮
  const toggleBtn = running
    ? `<button class="btn btn-sm" data-action="stop-service" data-kind="${esc(kind)}" data-version="${esc(version)}">${t('svc.stop')}</button>`
    : `<button class="btn btn-sm btn-primary" data-action="start-service" data-kind="${esc(kind)}" data-version="${esc(version)}">${t('svc.start')}</button>`;

    ? `<span class="status-pill pill-ok"><span class="pill-dot"></span>${t('svc.running')}</span>`
    : `<span class="status-pill pill-off"><span class="pill-dot"></span>${t('svc.stopped')}</span>`;

  return `<article class="card version-card">

    <div>${rows.join('')}</div>

      <button class="btn btn-sm btn-danger" data-action="uninstall" data-kind="${kind}" data-version="${esc(version)}">${t('svc.uninstall')}</button>

  </article>`;
}

function renderOverview(){
  const all = [];
  const push = (kind, versions) => versions.forEach((v,i)=>all.push({kind,version:v,running:isServiceRunning(kind, v)}));
  push('php', state.installed.php);
  push('mysql', state.installed.mysql);
  push('pgsql', state.installed.pgsql);
  push('redis', state.installed.redis);
  push('nginx', state.installed.nginx);
  const running = all.filter(x=>x.running).length;
  const stopped = all.length - running;
  const lines = new Set(all.map(x=>x.kind)).size;
  const rows = all.map(item=>{
    const meta = SVC_META[item.kind];
    const pill = item.running ? `<span class="status-pill pill-ok"><span class="pill-dot"></span>${t('svc.running')}</span>` : `<span class="status-pill pill-off"><span class="pill-dot"></span>${t('svc.stopped')}</span>`;
    return `<tr>
      <td><div class="svc-cell"><span class="svc-icon">${meta.icon}</span>${t(meta.titleKey)}</div></td>
      <td><span class="chip chip-accent">${esc(item.version)}</span></td>
      <td>${pill}</td>
      <td><span class="mono" style="font-size:11.5px;color:var(--text-mute)">phpbox-${item.kind}-${item.version}</span></td>
      <td><div class="row-actions"><button class="btn btn-sm" data-route-jump="${item.kind}">${t('overview.manage')}</button></div></td>
    </tr>`;
  }).join('');
  if(all.length === 0){
    return `<div class="view-inner">
      <header class="view-header"><div><h1>${t('overview.title')}</h1><p class="view-sub">${t('overview.subtitle')}</p></div></header>
      <div class="empty"><div class="empty-icon">🚀</div><h2>${t('overview.empty.title')}</h2><p>${t('overview.empty.desc')}</p>
        <button class="btn btn-primary" data-action="install" data-kind="php">${t('php.empty.action')}</button>
      </div>
    </div>`;
  }
  return `<div class="view-inner">
    <header class="view-header">
      <div><h1>${t('overview.title')}</h1><p class="view-sub">${t('overview.subtitle')}</p></div>
      <div class="header-actions"><button class="btn" data-action="run-task" data-args="doctor" data-label="${t('overview.doctorTask')}">${t('overview.doctor')}</button></div>
    </header>
    <div class="summary">
      <div class="summary-item"><div class="summary-num">${all.length}</div><div class="summary-label">${t('overview.instances')}</div></div>
      <div class="summary-item"><div class="summary-num" style="color:var(--ok)">${running}</div><div class="summary-label">${t('overview.running')}</div></div>
      <div class="summary-item"><div class="summary-num">${stopped}</div><div class="summary-label">${t('overview.stopped')}</div></div>
      <div class="summary-item"><div class="summary-num">${lines}</div><div class="summary-label">${t('overview.lines')}</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th style="width:22%">${t('overview.col.svc')}</th><th style="width:16%">${t('overview.col.ver')}</th><th style="width:18%">${t('overview.col.status')}</th><th style="width:30%">${t('overview.col.container')}</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function render(){
  const fn = VIEWS[state.route] || VIEWS.sites;
  $('#view').innerHTML = fn();
  renderNav();
  renderSidebarLabels();
  setupInlineEdit($('#view'));
  setupPortEdit($('#view'));
  if(state.route === 'settings') setupLayoutControls();
}

function renderNav(){
  $('#nav').innerHTML = NAV.map(item=>{
    if(item.section) return `<div class="nav-section">${esc(t(item.section))}</div>`;
    const count = countFor(item.id);
    const badge = count != null ? `<span class="nav-badge">${count}</span>` : '';
    return `<button class="nav-item ${state.route===item.id?'active':''}" data-route="${item.id}" title="${esc(t(item.labelKey))}">
      <span class="nav-icon">${item.icon}</span>
      <span class="nav-label">${esc(t(item.labelKey))}</span>
      ${badge}
    </button>`;
  }).join('');
}
function countFor(id){
  if(id==='sites') return state.sites.length || null;
  if(id==='php')   return state.installed.php.length || null;
  if(id==='mysql') return state.installed.mysql.length || null;
  if(id==='pgsql') return state.installed.pgsql.length || null;
  if(id==='redis') return state.installed.redis.length || null;
  if(id==='nginx') return state.installed.nginx.length || null;
  if(id==='go')    return state.go.length || null;
  if(id==='backup')return state.backups.length || null;
  return null;
}

  function bind(root){ $$('.theme-card', root).forEach(el=>{ el.addEventListener('click', ()=>{ selected=el.dataset.themeId; applyTheme(selected); $('#theme-grid', root).innerHTML=build(); bind(root); }); }); }
  const root = openModalShell(`<div class="modal modal-lg" role="dialog" aria-modal="true"><div class="modal-head"><h3>${t('theme.title')}</h3><p>${t('theme.subtitle')}</p></div><div class="modal-body"><div class="theme-grid" id="theme-grid">${build()}</div></div><div class="modal-foot"><button class="btn" data-modal-close>${t('theme.done')}</button></div><div class="modal-resizer"></div></div>`);
  bind(root);

}

function openSiteConfigModal(domain){
  const site = state.sites.find(s=>s.domain===domain);
  if(!site) return;

  const content = getVhost(domain);

  // ★ 高度占据主界面 80%
  const root = openModalShell(`<div class="modal modal-xl" style="height:80vh" role="dialog" aria-modal="true">

        </div>
        <textarea class="config-editor" id="vhost-editor" spellcheck="false"></textarea>
      </div>
      <div class="config-hint">
        <div class="alert alert-info">${t('siteConfig.hint')}</div>
      </div>
    </div>

      <button class="btn" id="vhost-reset">${t('siteConfig.reset')}</button>

      <button class="btn btn-primary" id="vhost-save">${t('siteConfig.save')}</button>
    </div>
    <div class="modal-resizer"></div>
  </div>`);

  const editor = $('#vhost-editor', root);
  const statusEl = $('#vhost-status', root);
  const saveBtn = $('#vhost-save', root);
  const resetBtn = $('#vhost-reset', root);

  editor.value = content;

  function isDirty(){ return editor.value !== original; }
  function sync(){
    const dirty = isDirty();
    statusEl.textContent = dirty ? t('siteConfig.unsaved') : '';
    statusEl.classList.toggle('dirty', dirty);
    saveBtn.disabled = !dirty;
    resetBtn.disabled = !dirty;
  }

  editor.addEventListener('input', sync);
  editor.addEventListener('keydown', e => {
    if(e.key === 'Tab'){
      e.preventDefault();
      const ta = e.target;
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      sync();
    }
  });

  resetBtn.addEventListener('click', () => { editor.value = original; sync(); });
  sync();

  $$('[data-modal-close]', root).forEach(b => b.addEventListener('click', closeModal));

  saveBtn.addEventListener('click', () => {
    const newContent = editor.value;
    state.vhosts[domain] = newContent;

    const listenMatch = newContent.match(/listen\s+(\d+)/);
    if(listenMatch){
      const p = parseInt(listenMatch[1], 10);
      if(!isNaN(p)) site.port = p;
    }
    const rootMatch = newContent.match(/^\s*root\s+([^;]+);/m);
    if(rootMatch) site.root = rootMatch[1].trim();

    original = newContent;
    closeModal();
    render();
    runTask(
      ['site', 'vhost', 'save', domain],
      `${domain} · nginx 配置`,
      { type: 'site-vhost', domain }
    );
    toast(t('siteConfig.saved', {domain}), 'ok', 2400);
  });
}

function openInstallModal(kind){
  const meta = SVC_META[kind];
  const installed = state.installed[kind] || [];
  const isSingle = !!meta.single;
  const needPort = needsPort(kind);
  const needPw = needsPassword(kind);
  const needExt = kind === 'php';
  let passwordVisible = false;

  const root = openModalShell(`
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${t('install.title', {name: t(meta.titleKey)})}</h3><p>${t('install.subtitle')}</p></div>
      <div class="modal-body">
        <div class="field"><label>${t('install.version')}</label>
          <input id="m-ver" type="text" autocomplete="off" placeholder="${esc(meta.suggested[0])}" value="${isSingle?esc(meta.suggested[0]):''}">
          <div class="quick-picks">${meta.suggested.map(v=>{ const taken = installed.includes(v); return `<button class="pick ${taken?'selected':''}" data-ver="${esc(v)}">${esc(v)}${taken?' ✓':''}</button>`; }).join('')}</div>
        </div>
        ${needPort ? `<div class="field"><label>${t('install.port')}</label><input id="m-port" type="text" autocomplete="off" spellcheck="false" inputmode="numeric"><div class="hint">${t('install.port.hint')}</div></div>` : ''}
        ${needPw ? `<div class="field"><label>${t('install.password')}</label><div class="input-with-action">
          <input id="m-password" type="password" autocomplete="off" spellcheck="false">
          <button class="input-action-btn" id="m-toggle-pw" type="button" title="${t('install.showPassword')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="input-action-btn" id="m-regen-pw" type="button" title="${t('install.regen')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
        </div><div class="hint">${t('install.password.hint')}</div></div>` : ''}
        ${needExt ? `<div class="field"><label>${t('php.extensions')} (${t('common.optional')})</label><input id="m-ext" type="text" autocomplete="off" placeholder="redis,gd,imagick"><div class="hint">${t('install.ext.hint')}</div></div>` : ''}
        <div class="field"><label>${t('install.preview')}</label><div class="cmd-preview" id="m-preview"></div></div>
      </div>
      <div class="modal-foot"><button class="btn" data-modal-close>${t('common.cancel')}</button><button class="btn btn-primary" id="m-ok">${t('install.install')}</button></div>
      <div class="modal-resizer"></div>
    </div>`);

  const verInput = $('#m-ver', root);
  const portInput = needPort ? $('#m-port', root) : null;
  const pwInput = needPw ? $('#m-password', root) : null;
  const extInput = needExt ? $('#m-ext', root) : null;
  const preview = $('#m-preview', root);

  function refreshPortSuggestion(){
    if(!portInput) return;
    const v = verInput.value.trim() || meta.suggested[0];
    portInput.value = suggestPortFor(kind, v);
  }
  if(pwInput) pwInput.value = genPassword();

  function buildArgs(){
    const v = verInput.value.trim();
    const args = [kind, 'install'];
    if(v) args.push(v);
    if(needPort && portInput && portInput.value.trim()) args.push('--port', portInput.value.trim());
    if(needPw && pwInput && pwInput.value.trim()) args.push('--password', pwInput.value.trim());
    if(needExt && extInput && extInput.value.trim()) args.push('--ext', extInput.value.trim());
    return args;
  }
  function buildPreviewText(){
    const v = verInput.value.trim() || '<version>';
    const lines = [`phpbox ${kind} install ${v}`];
    if(needPort && portInput) lines.push(`--port ${portInput.value.trim() || '<port>'}`);
    if(needPw && pwInput) { const p = pwInput.value.trim(); lines.push(`--password ${p ? '****' + p.slice(-4) : '<password>'}`); }
    if(needExt && extInput && extInput.value.trim()) lines.push(`--ext ${extInput.value.trim()}`);
    return lines.length > 1 ? lines.join(' \\\n  ') : lines[0];
  }
  function update(){ preview.innerHTML = `<span class="prompt">$ </span>${esc(buildPreviewText())}`; }

  verInput.addEventListener('input', ()=>{ refreshPortSuggestion(); update(); });
  $$('.pick', root).forEach(p => p.addEventListener('click', ()=>{ verInput.value=p.dataset.ver; $$('.pick', root).forEach(x=>x.classList.remove('selected')); p.classList.add('selected'); refreshPortSuggestion(); update(); }));
  refreshPortSuggestion(); update();
  if(portInput) portInput.addEventListener('input', update);
  if(pwInput) pwInput.addEventListener('input', update);
  if(extInput) extInput.addEventListener('input', update);

  const toggleBtn = $('#m-toggle-pw', root);
  if(toggleBtn && pwInput){ toggleBtn.addEventListener('click', ()=>{ passwordVisible=!passwordVisible; pwInput.type = passwordVisible ? 'text' : 'password'; }); }
  const regenBtn = $('#m-regen-pw', root);
  if(regenBtn && pwInput){ regenBtn.addEventListener('click', ()=>{ pwInput.value = genPassword(); update(); }); }

  setTimeout(()=>verInput.focus(), 60);
  $$('[data-modal-close]', root).forEach(b => b.addEventListener('click', closeModal));
  $('#m-ok', root).addEventListener('click', ()=>{
    const v = verInput.value.trim();
    if(!v){ toast(t('install.needVersion'), 'err'); return; }
    if(needPort && portInput){ const p = portInput.value.trim(); if(!/^\d{1,5}$/.test(p)){ toast(t('common.invalidPort'), 'err'); portInput.focus(); return; } }
    if(needPw && pwInput){ const p = pwInput.value.trim(); if(p.length < 6){ toast(t('common.shortPassword'), 'err'); pwInput.focus(); return; } }
    const args = buildArgs();
    closeModal();
    runTask(args, `${t('svc.install')} ${t(meta.titleKey)} ${v}`, { type:'install', kind, version:v, port: portInput?portInput.value.trim():null, password: pwInput?pwInput.value.trim():null });
  });
}

function openConfigModal(kind, version){
  const meta = SVC_META[kind];
  const files = getDefaultFiles(kind, version);
  if(!files.length){ toast('No config files', 'info'); return; }

  let activeFile = files[0].name;
  const originals = {};
  const drafts = {};
  files.forEach(f => {
    const c = getFileContent(kind, version, f.name);
    originals[f.name] = c;
    drafts[f.name] = c;
  });

  function isModified(name){ return drafts[name] !== originals[name]; }
  function modifiedCount(){ return files.filter(f => isModified(f.name)).length; }
  function currentFile(){ return files.find(f => f.name === activeFile); }

  function fileListHtml(){
    return files.map(f => {
      const mod = isModified(f.name) ? ' modified' : '';
      const active = f.name === activeFile ? ' active' : '';
      return `<button class="config-file${active}${mod}" data-file="${esc(f.name)}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
        <span class="file-name">${esc(f.name)}</span>
        <span class="file-dot"></span>
      </button>`;
    }).join('');
  }

  function editorHtml(){
    const f = currentFile();
    return `<div class="config-editor-head">
      <span class="path-text" title="${esc(f.path)}">${esc(f.path)}</span>
      <span style="font-size:11.5px;color:var(--text-mute);flex-shrink:0">${esc(t('config.editorHint'))}</span>
    </div>
    <textarea class="config-editor" id="config-editor" spellcheck="false"></textarea>`;
  }

  const root = openModalShell(`<div class="modal modal-xl" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${esc(t(meta.titleKey))} ${esc(version)} · ${t('config.title')}</h3><p>${t('config.subtitle')}</p></div>
    <div class="modal-body config-body">
      <div class="config-layout">
        <aside class="config-files" id="config-files">
          <div class="config-files-label">${t('config.files')}</div>
          ${fileListHtml()}
        </aside>
        <div class="config-editor-wrap" id="config-editor-wrap">
          ${editorHtml()}
        </div>
      </div>
      <div style="padding:12px 22px;border-top:1px solid var(--border-2);background:var(--surface-2)">
        <div class="alert alert-info" style="padding:8px 12px">${t('config.hint')}</div>
      </div>
    </div>
    <div class="modal-foot">
      <span style="flex:1;font-size:12px;color:var(--text-mute);font-family:var(--mono)" id="config-status"></span>
      <button class="btn" id="config-reset">${t('config.reset')}</button>
      <button class="btn" data-modal-close>${t('common.cancel')}</button>
      <button class="btn btn-primary" id="config-apply">${t('config.apply')}</button>
    </div>
    <div class="modal-resizer"></div>
  </div>`);

  const editorEl = () => $('#config-editor', root);
  const statusEl = () => $('#config-status', root);
  const applyBtn = () => $('#config-apply', root);
  const resetBtn = () => $('#config-reset', root);

  function syncStatus(){
    const n = modifiedCount();
    if(n > 0){
      statusEl().innerHTML = `<span style="color:var(--warn)">● ${t('config.unsaved')}</span> · ${n}/${files.length}`;
      applyBtn().disabled = false;
      applyBtn().textContent = t('config.applyCount', {count: n});
      resetBtn().disabled = false;
    } else {
      statusEl().textContent = '';
      applyBtn().disabled = true;
      applyBtn().textContent = t('config.apply');
      resetBtn().disabled = true;
    }
  }

  function loadEditor(){
    const ta = editorEl();
    ta.value = drafts[activeFile] || '';
    ta.scrollTop = 0;
    syncStatus();
  }

  function bindFiles(){
    $$('.config-file', root).forEach(btn => {
      btn.addEventListener('click', () => {
        drafts[activeFile] = editorEl().value;
        activeFile = btn.dataset.file;
        $('#config-files', root).innerHTML = `<div class="config-files-label">${t('config.files')}</div>` + fileListHtml();
        bindFiles();
        loadEditor();
      });
    });
  }

  loadEditor();
  bindFiles();

  root.addEventListener('input', e => {
    if(e.target && e.target.id === 'config-editor'){
      drafts[activeFile] = e.target.value;
      syncStatus();
      $$('.config-file', root).forEach(btn => {
        const nm = btn.dataset.file;
        btn.classList.toggle('modified', isModified(nm));
      });
    }
  });

  root.addEventListener('keydown', e => {
    if(e.target && e.target.id === 'config-editor' && e.key === 'Tab'){
      e.preventDefault();
      const ta = e.target;
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + '    ' + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 4;
      drafts[activeFile] = ta.value;
      syncStatus();
    }
  }, true);

  resetBtn().addEventListener('click', () => {
    drafts[activeFile] = originals[activeFile];
    loadEditor();
    $$('.config-file', root).forEach(btn => {
      btn.classList.toggle('modified', isModified(btn.dataset.file));
    });
  });

  applyBtn().addEventListener('click', () => {
    drafts[activeFile] = editorEl().value;
    const changedFiles = files.filter(f => isModified(f.name));
    if(!changedFiles.length){ toast(t('config.noChanges'), 'info', 1400); return; }
    changedFiles.forEach(f => setFileContent(kind, version, f.name, drafts[f.name]));
    const fileNames = changedFiles.map(f => f.name);
    closeModal();
    runTask([kind, 'config', 'save', version, '--files', fileNames.join(',')],
      `${kind} ${version} · ${t('config.title')} (${fileNames.length})`,
      { type:'service-config', kind, version, files: fileNames });
    toast(t('config.saved', {kind, version, count: fileNames.length}), 'ok', 2600);
  });

  $$('[data-modal-close]', root).forEach(b => b.addEventListener('click', closeModal));
}

/* ★ PHP 扩展管理弹窗：支持启用/停用、添加、删除 */
function openPhpExtensionsModal(version){
  const originalExts = [...(state.phpExtensions[version] || [])];
  let enabledList = [...originalExts];
  const selected = new Set(originalExts);

  function getSuggestions(){ return EXT_LIB.filter(e=>!enabledList.includes(e)).slice(0,12); }

  function buildBody(){
    const suggestions = getSuggestions();
    const enabledHtml = enabledList.length
      ? enabledList.map(e=>{
          const on = selected.has(e);
          return `<span class="ext-pill ${on?'on':'off'}">
            <button type="button" class="ext-pill-main" data-ext="${esc(e)}" title="${on?t('ext.disable'):t('ext.enable')}">${esc(e)}</button>
            <button type="button" class="ext-pill-del" data-del="${esc(e)}" title="${t('ext.remove')}">×</button>
          </span>`;
        }).join('')
      : `<span style="color:var(--text-mute);font-size:12.5px">${t('ext.empty.enabled')}</span>`;
    const suggestHtml = suggestions.length
      ? suggestions.map(e=>{
          const on = selected.has(e);
          return `<button type="button" class="ext-toggle ${on?'on':'off'}" data-ext="${esc(e)}">${esc(e)}</button>`;
        }).join('')
      : `<span style="color:var(--text-mute);font-size:12.5px">${t('ext.empty.suggestions')}</span>`;
    const enabledOnCount = enabledList.filter(e=>selected.has(e)).length;
    const suggestOnCount = suggestions.filter(e=>selected.has(e)).length;
    return `
      <div class="field">
        <div style="display:flex;justify-content:space-between;align-items:center"><label>${t('ext.enabled')}</label><span class="mono" style="font-size:11.5px;color:var(--text-mute)">${t('ext.selected', {count: enabledOnCount, total: enabledList.length})}</span></div>
        <div class="ext-toggle-grid" id="ext-enabled">${enabledHtml}</div>
        <div class="hint">${t('ext.enabled.hint')}</div>
      </div>
      <div class="field">
        <div style="display:flex;justify-content:space-between;align-items:center"><label>${t('ext.suggestions')}</label><span class="mono" style="font-size:11.5px;color:var(--text-mute)">${t('ext.selected', {count: suggestOnCount, total: suggestions.length})}</span></div>
        <div class="ext-toggle-grid" id="ext-suggestions">${suggestHtml}</div>
        <div class="hint">${t('ext.suggestions.hint')}</div>
      </div>
      <div class="field"><label>${t('ext.add')}</label><div style="display:flex;gap:8px"><input type="text" id="ext-add-input" placeholder="${t('ext.add.placeholder')}" autocomplete="off"><button class="btn btn-primary" id="ext-add-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>${t('ext.add.btn')}</button></div><div class="hint">${t('ext.add.hint')}</div></div>
      <div class="alert alert-warn"><strong>${t('rw.applyHint')}</strong></div>`;
  }

  function isDirty(){
    if(selected.size !== originalExts.length) return true;
    for(const e of selected) if(!originalExts.includes(e)) return true;
    return false;
  }

  function refresh(){
    $('#ext-body', root).innerHTML = buildBody();
    bindExt();
    const btn=$('#ext-apply',root);
    const dirty=isDirty();
    btn.disabled=!dirty;
    btn.textContent = dirty ? t('ext.applyWithCount', {count: selected.size}) : t('rw.current');
  }

  function bindExt(){
    // 已启用扩展：点击标签切换启用/停用
    $$('#ext-enabled .ext-pill-main', root).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const e=btn.dataset.ext;
        if(selected.has(e)) selected.delete(e); else selected.add(e);
        refresh();
      });
    });
    // 已启用扩展：点击 × 从列表中删除
    $$('#ext-enabled .ext-pill-del', root).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const e=btn.dataset.del;
        enabledList = enabledList.filter(x=>x!==e);
        selected.delete(e);
        refresh();
      });
    });
    // 推荐扩展：点击切换选中
    $$('#ext-suggestions .ext-toggle', root).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const e=btn.dataset.ext;
        if(selected.has(e)) selected.delete(e); else selected.add(e);
        refresh();
      });
    });
    const input=$('#ext-add-input',root); const addBtn=$('#ext-add-btn',root);
    function doAdd(){
      const name=input.value.trim();
      if(!name) return;
      if(!/^[a-zA-Z0-9._-]+$/.test(name)){ toast(t('toast.extInvalid'),'err'); return; }
      if(enabledList.includes(name)){ toast(t('toast.extAdded', {name}),'info',1600); input.value=''; return; }
      enabledList.push(name);
      selected.add(name);
      input.value='';
      refresh();
      setTimeout(()=>$('#ext-add-input', root)?.focus(), 30);
    }
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  }

  const root = openModalShell(`<div class="modal modal-lg" role="dialog" aria-modal="true"><div class="modal-head"><h3>PHP ${esc(version)} · ${t('ext.title')}</h3><p>${t('ext.subtitle')}</p></div><div class="modal-body" id="ext-body"></div><div class="modal-foot"><button class="btn" data-modal-close>${t('common.cancel')}</button><button class="btn btn-primary" id="ext-apply">${t('ext.apply')}</button></div><div class="modal-resizer"></div></div>`);
  refresh();
  setTimeout(()=>$('#ext-add-input', root)?.focus(), 80);
  $$('[data-modal-close]', root).forEach(b=>b.addEventListener('click', closeModal));
  $('#ext-apply', root).addEventListener('click', ()=>{
    if(!isDirty()){ closeModal(); return; }
    const finalExts = [...selected];
    const added = finalExts.filter(x=>!originalExts.includes(x));
    const removed = originalExts.filter(x=>!finalExts.includes(x));
    state.phpExtensions[version] = finalExts;
    closeModal();
    render();
    const parts = [];
    if(added.length) parts.push(`+${added.join(',')}`);
    if(removed.length) parts.push(`-${removed.join(',')}`);
    runTask(['php','extension','sync',version,'--ext',finalExts.join(',')], `PHP ${version} ext (${parts.join(' ')||'no change'})`, { type:'extensions', version, added, removed });
  });
}

function saveSettings(){
  const inputs = $$('input[data-env-key]');
  if(!inputs.length) return;
  const changes = [];
  inputs.forEach(input=>{ const key = input.dataset.envKey; const nv = input.value.trim(); const ov = state.env[key]; if(nv !== ov){ changes.push({key, old:ov, new:nv}); state.env[key] = nv; } });
  if(changes.length === 0){ toast(t('common.noChanges'),'info',1400); return; }
  const needRestart = changes.filter(c=>['WWW_ROOT','MYSQL_DATA_ROOT','PGSQL_DATA_ROOT'].includes(c.key));
  const msg = changes.map(c=>`${c.key}\n  ${c.old}  →  ${c.new}`).join('\n\n');
  if(needRestart.length){ toast(`${t('toast.settingsSaved',{count:changes.length})}\n\n${msg}\n\n${t('toast.settingsNeedRestart',{count:needRestart.length})}`, 'ok', 5200); }
  else { toast(`${t('toast.settingsSaved',{count:changes.length})}\n\n${msg}`, 'ok', 3600); }
}

async function pickFolder(targetKey){
  const applyPath = (name) => {
    const input = $(`input[data-env-key="${targetKey}"]`);
    if(input){ input.value = `~/${name}`; input.style.transition='border-color .2s'; input.style.borderColor='var(--accent)'; setTimeout(()=>{ input.style.borderColor=''; }, 800); }
    toast(`${t('toast.browseResult',{name})}\n\n${t('toast.browseBrowserLimit')}`, 'ok', 4200);
  };
  if(window.showDirectoryPicker){ try{ const handle = await window.showDirectoryPicker({id:'phpbox-'+targetKey, mode:'readwrite'}); applyPath(handle.name); return; }catch(err){ if(err && err.name==='AbortError') return; } }
  const fallback = document.createElement('input');
  fallback.type='file'; fallback.webkitdirectory=true; fallback.style.position='fixed'; fallback.style.opacity='0'; fallback.style.pointerEvents='none';
  document.body.appendChild(fallback);
  fallback.addEventListener('change', ()=>{ const files = fallback.files; fallback.remove(); if(!files || files.length===0) return; const rel = files[0].webkitRelativePath || ''; const rootName = rel.split('/')[0] || 'selected-folder'; applyPath(rootName); });
  fallback.click();
}

function downloadBackup(file){
  const content = `# phpbox backup archive (demo)\n# file: ${file}\n# restore: phpbox restore backups/${file}\n`;
  const blob = new Blob([content], {type:'application/gzip'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = file;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(t('toast.backupDownloaded',{file}), 'ok', 3600);
}
