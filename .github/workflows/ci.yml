# phpbox Desktop CI —— 工程验证链（AGENTS.md §4.3 同序）的自动化形态。
# 与本地验证链一致：vue-tsc → vite build → go vet → go test → build。
# 集成测试哲学同仓：真实环境优先，环境不可用（无 Docker daemon/无 phpbox CLI）的用例自动 SKIPPED——
# CI 绿色不等于集成全过，只证明静态链路无损（诚实验证边界）。
# Windows 交叉编译：v0.1 待办「Windows 构建验证」的构建级部分——真机运行行为仍待人工核实，CI 不冒充。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3 beta.20 默认 Linux 路径的 cgo 依赖（#cgo pkg-config: gtk4 webkitgtk-6.0 + x11）——
      # vet/test/build 任何一步做类型检查都要过 wails application 包的 cgo 编译，
      # 缺头文件即报 undefined: pointer / pkg-config not found，故必须在首个 Go 步之前安装。
      # 注意：默认构建路径是 GTK4（libgtk-4-dev），不是 GTK3——实测仅装 libgtk-3-dev 会挂（CI 第三跑教训）
      - name: System deps (cgo headers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libayatana-appindicator3-dev >/dev/null

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      # 验证链 1：类型检查（绑定 TS 由 wails3 generate 产出并已入库，CI 直接用）
      - name: vue-tsc
        working-directory: frontend
        run: npx vue-tsc --noEmit

      # 验证链 2：前端构建
      - name: vite build
        working-directory: frontend
        run: npm run build

      # 验证链 3：Go 静态检查
      - name: go vet
        run: go vet ./...

      # 验证链 4：Go 测试（无 Docker 的用例 SKIPPED 是预期行为，不是隐藏失败）
      - name: go test
        run: go test ./internal/... -v 2>&1 | tee /tmp/gotest.log
        continue-on-error: false

      # 验证链 5：Linux 生产构建（系统依赖已在作业首步安装）
      - name: CGO production build
        run: CGO_ENABLED=1 go build -o bin/phpbox-desktop .

  build-windows:
    name: Cross-compile (windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # main.go //go:embed all:frontend/dist —— 纯净 checkout 没有 gitignored 的 dist/，
      # 交叉编译前必须真实构建前端（与本地生产构建同源，不伪造空 embed）
      - name: Frontend deps + dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Windows 走 WebView2 纯系统调用无需 CGO（README/AGENTS 既有结论）
      - name: GOOS=windows build
        run: CGO_ENABLED=0 GOOS=windows go build -o bin/phpbox-desktop.exe .

      - name: Smoke assertion
        run: |
          test -s bin/phpbox-desktop.exe
          file bin/phpbox-desktop.exe | grep -q "PE32+ executable"
